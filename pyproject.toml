[project]
name = "deapi-mcp"
version = "0.8.1"
description = "Production-ready MCP server for the deAPI REST API"
authors = [
    {name = "deAPI Team"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "deapi", "ai", "inference", "llm", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=4.0.4,<5",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # The deAPI SDK backs the HTTP client. deapi_mcp uses its private modules (_client,
    # _config, _exceptions), so stay within one minor version and re-test on every bump.
    "deapi-sdk>=0.6.1,<0.7",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",
    # Optional shared store for OAuth authorization codes across replicas; with no
    # host configured the server falls back to an in-process store.
    "redis>=5.2,<8",
    # Pinned for AppStatus.disable_automatic_graceful_drain() (deapi_mcp/server_remote.py);
    # mcp itself only requires >=3.0.0.
    "sse-starlette>=3.5.0,<4",
]
# Metrics exposition (e.g. Prometheus) is not a core dependency: a deployment that wants
# it injects its own overlay through create_app(server, metrics=...).

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "fakeredis[lua]>=2.26",
    "mypy>=1.5",
]

[project.scripts]
deapi-mcp = "deapi_mcp.server_remote:main"

[project.urls]
Homepage = "https://deapi.ai"
Documentation = "https://docs.deapi.ai/execution-modes-and-integrations/mcp-server"
Repository = "https://github.com/deapi-ai/mcp-server-deapi"
Issues = "https://github.com/deapi-ai/mcp-server-deapi/issues"
Changelog = "https://github.com/deapi-ai/mcp-server-deapi/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deapi_mcp"]

[tool.hatch.build.targets.sdist]
# An allow-list: only these reach the source distribution, whatever else sits in the
# working tree (virtualenvs, .env files, build output).
only-include = [
    "deapi_mcp",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "SECURITY.md",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
